name: Update README

on:
  # Run every 6 hours on weekdays (UTC) — aligns with trading hours across IST/EST
  schedule:
    - cron: "0 0,6,12,18 * * 1-5"

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Required so the job can commit back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance


      - name: Run updater script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/update_readme.py
          echo "--- FILE SIZE CHECK ---"
          ls -lh README.md
          
          # Failsafe: Abort if README is larger than 1 MB
          SIZE=$(wc -c < README.md)
          if [ "$SIZE" -gt 1000000 ]; then
            echo "CRITICAL ERROR: Python script bloated the README to $SIZE bytes!"
            exit 1
          fi
    
      - name: Commit and push changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
          git add README.md
      
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
      
          git commit -m "chore: update market data and activity [skip ci]"
      
          git pull --rebase origin main
          git push origin main
