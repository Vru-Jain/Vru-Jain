name: Update README

on:
  # Run every 6 hours on weekdays (UTC) — aligns with trading hours across IST/EST
  schedule:
    - cron: "0 0,6,12,18 * * 1-5"

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Required so the job can commit back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance


      - name: Run updater script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/update_readme.py
          echo "--- FILE SIZE CHECK ---"
          ls -lh README.md
          
          # Failsafe: Abort if README is larger than 1 MB
          SIZE=$(wc -c < README.md)
          if [ "$SIZE" -gt 1000000 ]; then
            echo "CRITICAL ERROR: Python script bloated the README to $SIZE bytes!"
            exit 1
          fi

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Force remove any corrupted git cache for this file before adding
          git rm --cached README.md || true
          git add README.md
          
          git diff --cached --quiet || git commit -m "chore: update market data and activity [skip ci]"
          git push
